<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Экспорт комментариев</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <div id="platform-label" class="eyebrow">INSTAGRAM · TIKTOK</div>
      <h1>Комментарии в Markdown</h1>
      <p class="hint">
        Откройте нужный Reel или TikTok. Расширение раскроет доступные комментарии и ответы,
        затем скачает <code>.md</code>-отчёт.
      </p>

      <button id="export-button" type="button">
        <span class="button-label">Скачать отчёт</span>
        <span class="spinner" aria-hidden="true"></span>
      </button>

      <p id="status" class="status" role="status" aria-live="polite"></p>
      <p class="note">Во время сбора не закрывайте вкладку с видео.</p>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
